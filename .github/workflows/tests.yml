name: Tests

# Started manually from the Actions tab, so nothing runs against the live Solflare site on every push.
on:
  workflow_dispatch:
    inputs:
      browser:
        description: Browser for the E2E test
        type: choice
        options: [all, chrome, firefox]
        default: all

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:api
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-report
          path: |
            reports/api
            logs

  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ inputs.browser == 'all' && fromJSON('["chrome", "firefox"]') || fromJSON(format('["{0}"]', inputs.browser)) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:e2e -- --browser=${{ matrix.browser }} --headless
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-${{ matrix.browser }}-failure
          path: |
            screenshots
            logs
