name: Tests

# Started manually from the Actions tab (Run workflow)
on:
  workflow_dispatch:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:api
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: api-report
          path: playwright-report
      # Raw Allure results, the report job turns them into one report together with the E2E results
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: allure-results-api
          path: allure-results/api

  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chrome, firefox]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:e2e -- --browser=${{ matrix.browser }} --headless
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: allure-results-e2e-${{ matrix.browser }}
          path: allure-results/e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: e2e-screenshots-${{ matrix.browser }}
          path: screenshots

  # One Allure report for the API tests and the E2E test in both browsers, built after they finished, passed or failed
  report:
    needs: [api, e2e]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Every artifact lands in its own folder: allure-results/allure-results-api, .../allure-results-e2e-chrome, ...
      - uses: actions/download-artifact@v8
        with:
          pattern: allure-results-*
          path: allure-results
      # Name, grouping and categories come from allurerc.mjs, the result folders are the downloaded artifacts
      - run: npx allure generate allure-results/*
      - uses: actions/upload-artifact@v7
        with:
          name: allure-report
          path: allure-report
